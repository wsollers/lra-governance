  - id: not:canonical-conjunctive-normal-form
    symbol: '\operatorname{CCNF}'
    category: logic_operator
    description: Canonical conjunctive normal form operator.
  - id: not:for-all
    symbol: '\forall'
    category: quantifier
    description: Universal quantifier.
  - id: not:there-exists
    symbol: '\exists'
    category: quantifier
    description: Existential quantifier.
  - id: not:logical-negation
    symbol: '\neg'
    category: connective
    description: Logical negation connective.
    notation_role:
      role: logical_negation
      parser_connective: true
      preferred_context: displayed_formal_logic
  - id: not:logical-conjunction
    symbol: '\land'
    category: connective
    description: Logical conjunction connective.
    notation_role:
      role: logical_conjunction
      parser_connective: true
      preferred_context: displayed_formal_logic
  - id: not:logical-disjunction
    symbol: '\lor'
    category: connective
    description: Logical disjunction connective.
    notation_role:
      role: logical_disjunction
      parser_connective: true
      preferred_context: displayed_formal_logic
  - id: not:if-and-only-if
    symbol: '\Longleftrightarrow'
    category: connective
    description: Biconditional connective.
    notation_role:
      role: logical_equivalence
      parser_connective: true
      preferred_context: displayed_formal_logic
  - id: not:implies
    symbol: '\Rightarrow'
    category: connective
    description: Implication connective.
    notation_role:
      role: logical_implication
      parser_connective: true
      preferred_context: compact_or_inline_logic
  - id: not:compact-implies
    symbol: '\rightarrow'
    category: connective
    description: Compact implication connective for inline or formula-object contexts.
    notation_role:
      role: logical_implication
      parser_connective: true
      preferred_context: compact_or_inline_logic
  - id: not:long-implies
    symbol: '\Longrightarrow'
    category: connective
    description: Long implication connective for displayed formal logic.
    notation_role:
      role: logical_implication
      parser_connective: true
      preferred_context: displayed_formal_logic
  - id: not:inline-iff
    symbol: '\iff'
    category: connective
    description: Inline biconditional connective.
    notation_role:
      role: logical_equivalence
      parser_connective: true
      preferred_context: compact_or_inline_logic
  - id: not:compact-iff
    symbol: '\leftrightarrow'
    category: connective
    description: Compact biconditional connective for inline or formula-object contexts.
    notation_role:
      role: logical_equivalence
      parser_connective: true
      preferred_context: compact_or_inline_logic
  - id: not:semantic-satisfaction
    symbol: '\models'
    category: relation_notation
    description: Semantic satisfaction relation.
    notation_role:
      role: semantic_satisfaction
      parser_connective: true
      preferred_context: semantic_logic
  - id: not:syntactic-derivability
    symbol: '\vdash'
    category: relation_notation
    description: Syntactic derivability relation.
    notation_role:
      role: syntactic_derivability
      parser_connective: true
      preferred_context: proof_theory
  - id: not:formula-object-equivalence
    symbol: '\equiv'
    category: relation_notation
    description: Formula-object equivalence relation.
    notation_role:
      role: formula_object_equivalence
      parser_connective: true
      preferred_context: formula_object_equivalence
  - id: not:function-type-arrow
    symbol: '\to'
    category: function_notation
    description: >
      Function type arrow, as in f\colon A\to B.
    notation_role:
      role: function_type_arrow
      parser_connective: false
      preferred_context: function_signature
  - id: not:function-rule-arrow
    symbol: '\mapsto'
    category: function_notation
    description: >
      Function rule arrow, as in x\mapsto f(x).
    notation_role:
      role: function_rule_arrow
      parser_connective: false
      preferred_context: function_rule
  - id: not:function-signature-colon
    symbol: '\colon'
    category: punctuation_notation
    description: >
      Function signature colon, as in f\colon A\to B.
    notation_role:
      role: function_signature_colon
      parser_connective: false
      preferred_context: function_signature
  - id: not:set-builder-colon
    symbol: ':'
    category: punctuation_notation
    description: >
      Set-builder separator, as in \{x\in X: x>0\}.
    notation_role:
      role: set_builder_separator
      parser_connective: false
      preferred_context: set_builder
  - id: not:set-builder-mid
    symbol: '\mid'
    category: punctuation_notation
    description: >
      Alternate set-builder separator, as in \{x\in X\mid x>0\}.
    notation_role:
      role: set_builder_separator
      parser_connective: false
      preferred_context: set_builder
  - id: not:less-than-or-equal-house
    symbol: '\leq'
    category: relation_notation
    description: House form for less-than-or-equal relation.
    notation_role:
      role: order_relation
      parser_connective: false
      preferred_context: mathematical_relation
  - id: not:greater-than-or-equal-house
    symbol: '\geq'
    category: relation_notation
    description: House form for greater-than-or-equal relation.
    notation_role:
      role: order_relation
      parser_connective: false
      preferred_context: mathematical_relation
  - id: not:domain-operator-uppercase
    symbol: '\operatorname{Dom}'
