operator_bridges:
  - id: bridge:sup-equals-negative-inf
    description: >
      Reflection identity bridge used to unfold statements of the form
      \sup(-A)=-\inf A into least-upper-bound and greatest-lower-bound
      predicate witnesses before definitional expansion.
    pattern: sup_set_equals_negative_inf_set
    left_operator: '\sup'
    right_operator: '\inf'
    witness_symbol: i
    ambient_argument_default: '\mathbb{R}'
    expansions:
      - from_operator: '\inf'
        result: '<witness>'
        set: '<right_set>'
      - from_operator: '\sup'
        result: '-<witness>'
        set: '<left_set>'
