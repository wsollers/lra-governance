name: Governance Core Tests

on:
  pull_request:
  push:
    paths:
      - "tools/governance/generate_stub.py"
      - "tools/governance/generators/**"
      - "tools/governance/validators/**"
      - "tools/governance/validate_volume.py"
      - "tools/governance/test_auditor_prompt_boundaries.py"
      - "tools/governance/test_audit_chapter_symbols.py"
      - "tools/governance/test_toolkit_planning.py"
      - "tools/governance/audit_chapter_symbols.py"
      - "constitution/auditor/audits/stub.py"
      - "constitution/auditor/audits/symbols.py"
      - "constitution/auditor/audits/toolkits.py"
      - "constitution/auditor/cli.py"
      - "constitution/auditor/config.py"
      - "constitution/auditor/generators/**"
      - "constitution/schemas/audit-report.json"
      - "capabilities/**"
      - "docs/governance/**"
      - "tools/governance/test_stub_generator_validator_contract.py"
      - ".github/workflows/governance-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-core-tests:
    name: Governance core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.13", "3.13.9"]
    steps:
      - name: Checkout governance
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validator dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Compile changed governance tools
        run: |
          python -m py_compile \
            capabilities/resolve.py \
            scripts/bootstrap_python.py \
            tools/governance/generate_stub.py \
            tools/governance/generators/proof_stub.py \
            tools/governance/generators/mathematical_tex.py \
            tools/governance/generators/chapter_stub.py \
            tools/governance/generators/section_stub.py \
            tools/governance/generators/capstone_stub.py \
            tools/governance/generators/volume_stub.py \
            tools/governance/validate_volume.py \
            tools/governance/audit_chapter_symbols.py \
            tools/governance/validators/chapter_router.py \
            tools/governance/validators/chapter_stub.py \
            tools/governance/validators/planned_volume_stub.py \
            tools/governance/validators/toolkit_coverage.py \
            constitution/auditor/audits/stub.py \
            constitution/auditor/audits/symbols.py \
            constitution/auditor/audits/toolkits.py \
            constitution/auditor/cli.py \
            tools/governance/generate_lean_crosswalk_html.py \
            tools/governance/invoke_external_gpt_reviewer.py \
            tools/governance/compare_semantic_ast_extractors.py \
            tools/governance/validate_external_reviewer_evidence.py \
            tools/governance/validate_registry_contract.py \
            tools/governance/validate_semantic_artifact.py \
            tools/governance/validate_semantic_logic.py \
            tools/governance/validate_topic_semantic_audit.py

      - name: Validate JSON Schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          paths = [
              Path("constitution/schemas/capability-manifest.schema.json"),
              Path("constitution/schemas/resolution-packet.schema.json"),
              Path("constitution/schemas/mathematical-content.schema.json"),
              Path("constitution/schema/semantic-artifact.schema.json"),
              Path("constitution/schema/semantic-artifact-package.schema.json"),
              Path("constitution/schema/semantic-artifact-support.schema.json"),
              Path("constitution/schema/semantic-aliases.schema.json"),
              Path("constitution/schema/lean-crosswalk.schema.json"),
              Path("constitution/schema/external-review-receipt.schema.json"),
              Path("constitution/schema/artifact-audit-validation.schema.json"),
              Path("constitution/schema/topic-semantic-audit.schema.json"),
          ]
          for path in paths:
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))
              print(f"validated {path}")
          PY

      - name: Test capability routing
        run: python capabilities/test_resolve.py

      - name: Check generated task index is current
        run: python capabilities/generate_task_index.py --check

      - name: Audit governance context and manifest integrity
        run: python tools/governance/audit_governance_context.py

      - name: Test stub generator-validator contracts
        run: |
          python -m pytest -q \
            tools/governance/test_stub_generator_validator_contract.py \
            tools/governance/test_auditor_prompt_boundaries.py \
            tools/governance/test_audit_chapter_symbols.py \
            tools/governance/test_toolkit_planning.py

      - name: Test semantic artifact validators and transport
        run: |
          python -m unittest \
            tools/governance/test_validate_semantic_artifact.py \
            tools/governance/test_validate_semantic_logic.py \
            tools/governance/test_compare_semantic_ast_extractors.py \
            tools/governance/test_generate_lean_crosswalk_html.py \
            tools/governance/test_validate_registry_contract.py \
            tools/governance/test_validate_topic_semantic_audit.py \
            tools/governance/test_validate_external_reviewer_evidence.py \
            tools/governance/test_invoke_external_gpt_reviewer.py
