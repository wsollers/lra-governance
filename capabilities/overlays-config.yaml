# Repo registry consumed by resolve.py, generate_overlays.py, and
# validate_code_repo_layout.py.
# kind: volume -> overlay is GENERATED by generate_overlays.py; any other kind
#       has a hand-maintained canonical overlay in capabilities/overlays/.
# plain_style: true -> Vol IV style; verifiers pass --no-require-box.
# layout: consumed by tools/governance/validate_code_repo_layout.py.
# notes: extra generated-overlay bullets for one volume (volume kind only).
# Success gates live in each repo's overlay file, not here.
repos:
  - repo: lra-governance
    kind: governance
    title: "Governance, capabilities, validators, and wrapper tooling"
  - repo: lra-volume-i
    kind: volume
    title: "Logic, Sets, and Proof"
  - repo: lra-volume-ii
    kind: volume
    title: "Volume II"
    notes:
      - "Every theorem-like or definition-like artifact should carry a stable
        label mappable to a formal verification target; when no target exists
        yet, record the status as pending rather than omitting the
        relationship."
      - "`\\LeanFormalizes{<book-label>}{lra-lean}{<module>}{<declaration>}{<status>}`
        records extraction-visible verification mappings; `<book-label>` must
        match the immediately preceding formal artifact. Status wording must
        not overclaim: `pending` (no target), `statement` (formal statement,
        incomplete proof), `checked` (declaration builds in `lra-lean` with no
        placeholders for that declaration)."
      - "Do not inline formal proof code as volume prose and do not place
        formal proof implementation work here; `lra-lean` owns checked formal
        source, and `lra-knowledge-explorer` owns the verification UI."
  - repo: lra-volume-iii
    kind: volume
    title: "Volume III"
  - repo: lra-volume-iv
    kind: volume
    title: "Volume IV"
    plain_style: true
  - repo: lra-volume-v
    kind: volume
    title: "Volume V"
  - repo: lra-volume-vi
    kind: volume
    title: "Volume VI"
  - repo: lra-volume-vii
    kind: volume
    title: "Volume VII"
  - repo: lra-volume-viii
    kind: volume
    title: "Volume VIII"
  - repo: lra-common
    kind: library
    title: "Shared LaTeX macros, boxes, and templates"
  - repo: lra-lean
    kind: lean
    title: "Lean formalization"
  - repo: lra-numerical-analysis
    kind: cpp
    title: "C++ / numerical companion"
    layout:
      language: cpp
      required_dirs: ["cmake", "docker", "tools"]
      code_roots: ["include", "src", "projects"]
      test_roots: ["tests", "projects/*/tests"]
  - repo: lra-nurbs
    kind: cpp
    title: "NURBS / numerical geometry"
    layout:
      language: cpp
      required_dirs: ["cmake", "docker", "tools"]
      code_roots: ["include", "src", "projects"]
      test_roots: ["tests", "projects/*/tests"]
  - repo: lra-proof-vault
    kind: vault
    title: "Handwritten proof records"
  - repo: lra-knowledge-explorer
    kind: python_tool
    title: "Knowledge Explorer web app"
    layout:
      language: python
      code_roots: ["src", "tools", "scripts", "reorder"]
      test_roots: ["tests"]
  - repo: lra-pdf-extractor
    kind: python_tool
    title: "PDF/source ingestion and candidate extraction tooling"
    layout:
      language: python
      code_roots: ["src", "tools", "scripts"]
      test_roots: ["tests"]
  - repo: lra-reading-categorizer
    kind: python_tool
    title: "Reading library categorization UI"
    layout:
      language: python
      code_roots: ["src", "scripts"]
      test_roots: ["tests"]
  - repo: lra-source-profiles
    kind: python_tool
    title: "Source profiles, source indexes, and active profile exports"
    layout:
      language: python
      code_roots: ["src", "tools", "scripts"]
      test_roots: ["tests"]
  - repo: lra-exercises
    kind: latex_artifact
    title: "Standalone exercise sheets, workbooks, and generated PDFs"
  - repo: lra-sources
    kind: catalog
    title: "Private source catalog and pointer indexes"
  - repo: lra-dashboard
    kind: web
    title: "Validator progress dashboard (static site)"
