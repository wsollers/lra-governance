# Per-repo overlay config consumed by generate_overlays.py.
# kind: volume -> uses the LaTeX authoring capabilities (stub/statement).
#       library|lean|cpp|vault|python_tool|latex_artifact -> authoring capabilities do NOT apply; overlay documents purpose.
# plain_style: true -> Vol IV style; verifiers pass --no-require-box (definitions are not boxed).
# title: short repo identity shown to agents.
repos:
  - repo: lra-governance
    kind: governance
    title: "Governance, capabilities, validators, and wrapper tooling"
  - repo: lra-volume-i
    kind: volume
    title: "Logic, Sets, and Proof"
  - repo: lra-volume-ii
    kind: volume
    title: "Volume II"
  - repo: lra-volume-iii
    kind: volume
    title: "Volume III"
  - repo: lra-volume-iv
    kind: volume
    title: "Volume IV"
    plain_style: true
  - repo: lra-volume-v
    kind: volume
    title: "Volume V"
  - repo: lra-volume-vi
    kind: volume
    title: "Volume VI"
  - repo: lra-volume-vii
    kind: volume
    title: "Volume VII"
  - repo: lra-volume-viii
    kind: volume
    title: "Volume VIII"
  - repo: lra-common
    kind: library
    title: "Shared LaTeX macros, boxes, and templates"
  - repo: lra-lean
    kind: lean
    title: "Lean formalization"
    # Docker is the reproducible validation path; native `lake build` is
    # acceptable only when the pinned lean-toolchain is installed locally.
    # Local Windows: `.\build.ps1 docker-build` then `.\build.ps1 build-all`.
    success_gates:
      - "docker build -t lra-lean ."
      - "docker run --rm -v \"$PWD:/workspace\" -w /workspace lra-lean lake build LRAVolumeI LRAVolumeII"
  - repo: lra-numerical-analysis
    kind: cpp
    title: "C++ / numerical companion"
    build_environment: "MSVC x64 developer environment"
    layout:
      language: cpp
      required_dirs: ["cmake", "docker", "tools"]
      code_roots: ["include", "src", "projects"]
      test_roots: ["tests", "projects/*/tests"]
    # Both platform gates must be green before push: MSVC validates the
    # Windows toolchain; the Docker gate validates Linux Clang/Ninja and runs
    # CTest inside the container. Run MSVC commands from a VS developer
    # environment (build-msvc.ps1 initializes vcvars64.bat).
    success_gates:
      - "powershell -ExecutionPolicy Bypass -File tools\\build-msvc.ps1"
      - "powershell -ExecutionPolicy Bypass -File tools\\build-docker-clang.ps1"
  - repo: lra-nurbs
    kind: cpp
    title: "NURBS / numerical geometry"
    build_environment: "CI matrix of Windows x64 MSVC + Vulkan SDK and Linux Clang via docker/linux-clang.Dockerfile; the Docker gates below are the portable path when MSVC is unavailable, with Release matching CI"
    layout:
      language: cpp
      required_dirs: ["cmake", "docker", "tools"]
      code_roots: ["include", "src", "projects"]
      test_roots: ["tests", "projects/*/tests"]
    success_gates:
      - "docker build -t lra-nurbs-linux -f docker/linux-clang.Dockerfile ."
      - "docker run --rm -v \"$PWD:/workspace\" -w /workspace lra-nurbs-linux bash -lc 'cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_CXX_FLAGS=\"-stdlib=libc++ -fexperimental-library\" -DCMAKE_EXE_LINKER_FLAGS=\"-stdlib=libc++ -fexperimental-library\" -DENABLE_SANITIZERS=OFF -DNDDE_ENABLE_CLANG_TIDY=OFF && cmake --build build --parallel && ctest --test-dir build --output-on-failure --parallel 4'"
  - repo: lra-proof-vault
    kind: vault
    title: "Handwritten proof records"
  - repo: lra-knowledge-explorer
    kind: python_tool
    title: "Knowledge Explorer web app"
    purpose: "Knowledge Explorer web app consuming extracted knowledge-graph data."
    layout:
      language: python
      code_roots: ["src", "tools", "scripts", "reorder"]
      test_roots: ["tests"]
    success_gates:
      - "python -m pytest tests"
  - repo: lra-pdf-extractor
    kind: python_tool
    title: "PDF/source ingestion and candidate extraction tooling"
    purpose: "PDF/source ingestion, bibliography normalization, candidate extraction, OCR/cleanup assistance, and staged review outputs. Candidate artifacts must be reviewed in the owning repo before integration."
    layout:
      language: python
      code_roots: ["src", "tools", "scripts"]
      test_roots: ["tests"]
    success_gates:
      - "python -m pytest tests"
  - repo: lra-reading-categorizer
    kind: python_tool
    title: "Reading library categorization UI"
    purpose: "Human-in-the-loop UI and taxonomy tooling for categorizing the local mathematical PDF collection. Outputs are local reading-library placement and review artifacts, not direct volume/source-profile integration."
    layout:
      language: python
      code_roots: ["src", "scripts"]
      test_roots: ["tests"]
    success_gates:
      - "python -m unittest discover -s tests"
  - repo: lra-source-profiles
    kind: python_tool
    title: "Source profiles, source indexes, and active profile exports"
    purpose: "Source-profile metadata, active source selections, volume/chapter source indexes, cached Markdown extracts, and attachment-slot exports. Outputs are staging/review inputs for owning repos."
    layout:
      language: python
      code_roots: ["src", "tools", "scripts"]
      test_roots: ["tests"]
    success_gates:
      - "python scripts\\validate_source_indexes.py"
      - "python -m pytest tests"
  - repo: lra-exercises
    kind: latex_artifact
    title: "Standalone exercise sheets, workbooks, and generated PDFs"
    purpose: "Standalone LaTeX exercise/workbook source and generated PDF artifacts. Use the governance-owned Docker LaTeX image described in docs/governance/repo-overlays/lra-exercises.md."
    success_gates:
      - "docker latexmk build for each changed exercise .tex source"
