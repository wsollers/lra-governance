    title: Look up LRA source, code, or vocabulary
    description: "Search indexed LRA sources, TeX artifacts, Lean declarations, C++ objects, and canonical vocabulary. Read-only lookup before authoring or citing; creates nothing."
    applies_to: [volume, lean, cpp, library, vault, python_tool, latex_artifact, governance]
    triggers: ["lookup lra", "search lra", "source lookup", "search source index", "search lra sources", "look up theorem", "look up this theorem", "lookup this theorem", "look up definition", "look up this definition", "search our code", "search indexed code", "search lean and tex"]
    eager_instructions: [capabilities/lookup-lra/capability.md]
    lazy_references: [capabilities/reference/source-indexing-policy.md, capabilities/prepare-lean-tex-lookup/capability.md]
    tools: [tools/governance/lra_lookup.py, tools/governance/vocabulary.py]
    schemas: [constitution/schema/source-indexing-policy.yaml]
    examples: [capabilities/lookup-lra/capability.md]
    outputs: [ranked source, TeX, Lean, C++, and vocabulary hits]
    verify: ["python {canonical}/tools/governance/lra_lookup.py --status"]
    token_budget: 4000

