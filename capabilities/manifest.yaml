version: 4
packet_version: 1
entrypoint: capabilities/ENTRYPOINT.md
# Single source of truth for agent task routing. capabilities/task-index.md is a
# generated human view of this file. Only eager_instructions enter the initial
# context packet; every other class is a pointer or command. token_budget covers
# the generated/root wrapper plus the resolver's eager packet.
#
# Trigger policy: triggers are a deterministic fast path for imperative,
# unambiguous phrasings only ("add theorem", "run ci"). Do not add bare verbs,
# broad noun phrases, or subject terms — ambiguous phrasing is carried by each
# route's description, the per-kind default route (which resolves with a
# re-route warning), and the --list / --route selection catalog.
token_estimator: unicode_chars_div_4_ceil
default_token_budget: 6000

routes:
