# Canonical source-indexing policy data. Guidance lives in
# capabilities/reference/source-indexing-policy.md. Consumed governance-relative
# by lra-source-profiles/scripts/source_index_policy.py (which also falls back
# to the legacy docs/governance/ path for older checkouts).
schema: lra-source-indexing-policy-v1
library_root:
  host_default: D:\Readings
  container_default: /readings
  sources_root: Sources
index_root:
  host_default: D:\Readings\indexes\lra
  container_default: /readings/indexes/lra
optional_catalog:
  repo_name: lra-sources
  env_var: LRA_SOURCES_ROOT
  sibling_default: ../lra-sources
  role: pointer_catalog_only
  must_not_store:
    - raw_pdfs
    - full_ocr_text
    - full_extracted_markdown
    - final_volume_notes
    - bibliography_shards
    - canonical_yaml
    - theorem_explorer_generated_data
source_profiles:
  env_var: LRA_SOURCE_PROFILES_ROOT
  sibling_default: ../lra-source-profiles
  volume_workbench_profiles:
    owner: lra-source-profiles
    default_scope: volume
    optional_override_scope: chapter
    folder_to_volume_maps: reviewable_source_profile_metadata
    selected_source_identity_fields:
      - source_id
      - sha256
      - object_id
    workflow_fields:
      - enabled
      - preferred_rank
      - slot_order
      - role
      - notes
    launch_order: enabled_sources_by_preferred_rank_or_slot_order
concept_candidate_discovery:
  receipt_schema: constitution/schema/concept-discovery-receipt.schema.json
  deterministic_tool: tools/governance/concept_candidate_discovery.py
  facade_tool: tools/governance/lra_lookup.py
  facade_flag: --candidate-discovery-config
  default_minimum_independent_close_sources: 5
  primary_source_lane:
    source_selection_order:
      - configured_topic_profile
      - configured_chapter_profile
      - configured_volume_profile
      - reviewed_source_list
    search_identity: stable_source_id
    exact_phrase:
      case_insensitive: true
      whitespace_and_ocr_line_break_tolerant: true
      do_not_loosen_phrase_when_expanding_labels: true
    formal_labels:
      - Definition
      - Theorem
      - Lemma
      - Proposition
      - Corollary
      - Exercise
      - Example
      - Counterexample
    proximity:
      same_physical_index_line: true
      within_physical_index_lines: 2
    direct_pdf_fallback_reasons:
      - empty_extraction
      - damaged_extraction
      - ambiguous_extraction
    false_positive_reasons:
      - no_formal_label_proximity
      - proof_or_citation_context
      - running_header
      - alternate_meaning
      - accidental_proximity
  mathlib_lane:
    independent_from_primary_sources: true
    required_fields:
      - pinned_version_or_commit
      - module
      - declaration
      - exact_signature
      - source_locator
      - relationship_to_candidate
  internal_lra_lane:
    discovery_evidence: false
    role: integration_evidence_after_candidate_selection
internal_object_indexes:
  role: lean_tex_verification_lookup
  canonical_tool: tools/governance/index_internal_objects.py
  delta_tool: tools/governance/update_internal_object_index.py
  workflow: capabilities/prepare-lean-tex-lookup/capability.md
  schema_version: lra.internal-object-index/1.0
  delta_state_schema_version: lra.internal-object-index-state/1.0
  primary_surfaces:
    - tex_source
    - lean_source
  render_surfaces:
    - pdf_page_map
  render_surface_role: downstream_page_and_visual_evidence
  default_output_location: ignored_build_or_external_index_root
  refresh_policy:
    ordinary_edit_loop: run_delta_tool
    force_full_rebuild_flag: --full
    trigger_events:
      - tex_formal_artifact_added_or_changed
      - tex_formal_artifact_deleted_or_moved
      - lean_declaration_added_or_changed
      - lean_declaration_deleted_or_moved
      - leanformalizes_link_added_or_changed
    pass_volume_repo_root_as_tex_root: true
    pass_lra_lean_root_as_lean_root: true
    nested_tex_roots_supported: false
  commit_policy:
    full_generated_indexes: do_not_commit_by_default
    delta_state_files: do_not_commit_by_default
    curated_crosswalks: may_commit_after_review
  tex:
    require_bracketed_display_name: true
    formalization_tag:
      macro: LeanFormalizes
      arguments:
        - tex_label
        - repo
        - module
        - declaration
        - status
      allowed_statuses:
        - checked
        - statement
        - pending
        - incomplete
      missing_target_action: create_lra_lean_followup_task
    indexed_kinds:
      - definition
      - theorem
      - lemma
      - proposition
      - corollary
      - axiom
    default_artifact_source: source
    skip_dirs:
      - _to_delete
      - build
  lean:
    indexed_kinds:
      - def
      - theorem
      - lemma
      - axiom
      - structure
      - class
      - inductive
readings_root:
  env_var: LRA_READINGS_ROOT
recursive_scan:
  indexable_roots:
    - Sources/Algebra
    - Sources/Analysis
    - Sources/Applied
    - Sources/Computer Science
    - Sources/Differential Equations
    - Sources/Foundations
    - Sources/Geometry
    - Sources/Measure Theory
    - Sources/Number Theory
    - Sources/Numerical Analysis
    - Sources/Physics
    - Sources/Topology
  library_only_roots:
    - Sources/Calculus
    - Sources/History
  housekeeping_dir_names:
    - _duplicates
    - duplicates
    - _hold
    - Hold
    - indexes
    - lra-source-profiles
  always_indexable_dir_names:
    - processed
  explicit_override_flag: --ignore-index-policy
